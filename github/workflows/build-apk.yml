name: Build Nightcore Night APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      native:
        description: "Include music scan and floating window (turn OFF if the build fails)"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NATIVE: ${{ github.event_name != 'workflow_dispatch' || inputs.native }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create project files
        run: |
          mkdir -p www native scripts
          echo "Files in the repository:"
          ls -la
          SRC=$(find . -maxdepth 3 -iname '*.html' -not -path './www/*' -not -path './node_modules/*' | head -n 1)
          if [ -z "$SRC" ]; then echo "ERROR: no .html file was found in the repository. Upload index.html to the main page of the repository."; exit 1; fi
          echo "Using web page: $SRC"
          cp "$SRC" www/index.html
          cat > package.json <<'NCEOF'
          {
            "name": "nightcore-night",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^7.0.0",
              "@capacitor/cli": "^7.0.0",
              "@capacitor/core": "^7.0.0"
            }
          }
          NCEOF
          cat > capacitor.config.json <<'NCEOF'
          {
            "appId": "com.nightcore.night",
            "appName": "Nightcore Night",
            "webDir": "www",
            "backgroundColor": "#000000",
            "android": {
              "adjustMarginsForEdgeToEdge": "auto"
            }
          }
          NCEOF
          cat > native/MainActivity.java <<'NCEOF'
          package __PKG__;

          import android.app.PendingIntent;
          import android.app.PictureInPictureParams;
          import android.app.RemoteAction;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.res.Configuration;
          import android.graphics.drawable.Icon;
          import android.os.Build;
          import android.os.Bundle;
          import android.util.Rational;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          import androidx.appcompat.app.AppCompatDelegate;
          import androidx.core.content.ContextCompat;

          import com.getcapacitor.BridgeActivity;

          import java.util.ArrayList;

          public class MainActivity extends BridgeActivity {
              static final String ACTION_CMD = "com.nightcore.night.PIP_CMD";

              private boolean playing = false;
              private boolean pipEnabled = true;
              private boolean inPip = false;
              private BroadcastReceiver receiver;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  // Always keep the light look, even when the phone is in dark mode.
                  AppCompatDelegate.setDefaultNightMode(AppCompatDelegate.MODE_NIGHT_NO);
                  registerPlugin(MusicScannerPlugin.class);
                  super.onCreate(savedInstanceState);

                  WebView wv = getBridge().getWebView();
                  WebSettings st = wv.getSettings();
                  if (Build.VERSION.SDK_INT >= 29) {
                      st.setForceDark(WebSettings.FORCE_DARK_OFF);
                  }
                  st.setMediaPlaybackRequiresUserGesture(false);

                  receiver = new BroadcastReceiver() {
                      @Override
                      public void onReceive(Context context, Intent intent) {
                          final String cmd = intent.getStringExtra("cmd");
                          if (cmd == null) return;
                          final WebView w = getBridge().getWebView();
                          w.post(new Runnable() {
                              @Override
                              public void run() {
                                  w.evaluateJavascript("window.__cmd&&window.__cmd('" + cmd + "')", null);
                              }
                          });
                      }
                  };
                  ContextCompat.registerReceiver(this, receiver, new IntentFilter(ACTION_CMD), ContextCompat.RECEIVER_NOT_EXPORTED);
              }

              public void setPlaying(boolean p) {
                  playing = p;
                  runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          if (inPip && Build.VERSION.SDK_INT >= 26) {
                              try {
                                  setPictureInPictureParams(buildPip());
                              } catch (Exception ignored) {
                              }
                          }
                      }
                  });
              }

              public void setPip(boolean enabled) {
                  pipEnabled = enabled;
              }

              @Override
              public void onUserLeaveHint() {
                  super.onUserLeaveHint();
                  if (pipEnabled && playing && Build.VERSION.SDK_INT >= 26 && !isInPictureInPictureMode()) {
                      try {
                          enterPictureInPictureMode(buildPip());
                      } catch (Exception ignored) {
                      }
                  }
              }

              @Override
              public void onPictureInPictureModeChanged(boolean isInPictureInPictureMode, Configuration newConfig) {
                  super.onPictureInPictureModeChanged(isInPictureInPictureMode, newConfig);
                  inPip = isInPictureInPictureMode;
                  final String js = "window.__pip&&window.__pip(" + isInPictureInPictureMode + ")";
                  final WebView w = getBridge().getWebView();
                  w.post(new Runnable() {
                      @Override
                      public void run() {
                          w.evaluateJavascript(js, null);
                      }
                  });
              }

              @Override
              public void onPause() {
                  super.onPause();
                  // Best effort: keep the music going when the app is in the background.
                  if (playing) {
                      try {
                          getBridge().getWebView().onResume();
                          getBridge().getWebView().resumeTimers();
                      } catch (Exception ignored) {
                      }
                  }
              }

              @Override
              public void onDestroy() {
                  try {
                      if (receiver != null) unregisterReceiver(receiver);
                  } catch (Exception ignored) {
                  }
                  super.onDestroy();
              }

              private PictureInPictureParams buildPip() {
                  ArrayList<RemoteAction> actions = new ArrayList<>();
                  actions.add(action(android.R.drawable.ic_media_previous, "Previous", "prev", 1));
                  actions.add(action(
                          playing ? android.R.drawable.ic_media_pause : android.R.drawable.ic_media_play,
                          playing ? "Pause" : "Play", "toggle", 2));
                  actions.add(action(android.R.drawable.ic_media_next, "Next", "next", 3));
                  return new PictureInPictureParams.Builder()
                          .setAspectRatio(new Rational(1, 1))
                          .setActions(actions)
                          .build();
              }

              private RemoteAction action(int icon, String title, String cmd, int code) {
                  Intent i = new Intent(ACTION_CMD).setPackage(getPackageName()).putExtra("cmd", cmd);
                  PendingIntent pi = PendingIntent.getBroadcast(this, code, i,
                          PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  return new RemoteAction(Icon.createWithResource(this, icon), title, title, pi);
              }
          }
          NCEOF
          cat > native/MusicScannerPlugin.java <<'NCEOF'
          package __PKG__;

          import android.Manifest;
          import android.content.ContentResolver;
          import android.content.ContentUris;
          import android.database.Cursor;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.util.Size;

          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;

          @CapacitorPlugin(
                  name = "MusicScanner",
                  permissions = {
                          @Permission(alias = "audio33", strings = { "android.permission.READ_MEDIA_AUDIO" }),
                          @Permission(alias = "audioOld", strings = { Manifest.permission.READ_EXTERNAL_STORAGE })
                  }
          )
          public class MusicScannerPlugin extends Plugin {

              private String alias() {
                  return Build.VERSION.SDK_INT >= 33 ? "audio33" : "audioOld";
              }

              @PluginMethod
              public void scan(PluginCall call) {
                  if (getPermissionState(alias()) == PermissionState.GRANTED) {
                      doScan(call);
                  } else {
                      requestPermissionForAlias(alias(), call, "permissionDone");
                  }
              }

              @PermissionCallback
              private void permissionDone(PluginCall call) {
                  if (getPermissionState(alias()) == PermissionState.GRANTED) {
                      doScan(call);
                  } else {
                      call.reject("Permission denied");
                  }
              }

              private void doScan(PluginCall call) {
                  JSArray list = new JSArray();
                  Uri collection = Build.VERSION.SDK_INT >= 29
                          ? MediaStore.Audio.Media.getContentUri(MediaStore.VOLUME_EXTERNAL)
                          : MediaStore.Audio.Media.EXTERNAL_CONTENT_URI;
                  String[] projection = {
                          MediaStore.Audio.Media._ID,
                          MediaStore.Audio.Media.TITLE,
                          MediaStore.Audio.Media.ARTIST,
                          MediaStore.Audio.Media.ALBUM_ID,
                          MediaStore.Audio.Media.DISPLAY_NAME
                  };
                  String selection = "(" + MediaStore.Audio.Media.IS_MUSIC + " != 0 OR "
                          + MediaStore.Audio.Media.DURATION + " >= 60000)";
                  try (Cursor c = getContext().getContentResolver().query(
                          collection, projection, selection, null,
                          MediaStore.Audio.Media.TITLE + " COLLATE NOCASE ASC")) {
                      if (c != null) {
                          while (c.moveToNext()) {
                              long id = c.getLong(0);
                              JSObject o = new JSObject();
                              o.put("id", id);
                              o.put("title", c.getString(1));
                              o.put("artist", c.getString(2));
                              o.put("albumId", c.getLong(3));
                              o.put("name", c.getString(4));
                              o.put("uri", ContentUris.withAppendedId(collection, id).toString());
                              list.put(o);
                          }
                      }
                  } catch (Exception e) {
                      call.reject("Scan failed: " + e.getMessage());
                      return;
                  }
                  JSObject res = new JSObject();
                  res.put("tracks", list);
                  call.resolve(res);
              }

              @PluginMethod
              public void art(PluginCall call) {
                  String uriStr = call.getString("uri");
                  long albumId = call.getData().optLong("albumId", 0);
                  Bitmap bmp = null;
                  try {
                      ContentResolver cr = getContext().getContentResolver();
                      if (Build.VERSION.SDK_INT >= 29 && uriStr != null) {
                          bmp = cr.loadThumbnail(Uri.parse(uriStr), new Size(256, 256), null);
                      } else if (albumId > 0) {
                          Uri art = ContentUris.withAppendedId(Uri.parse("content://media/external/audio/albumart"), albumId);
                          try (InputStream is = cr.openInputStream(art)) {
                              bmp = BitmapFactory.decodeStream(is);
                          }
                      }
                  } catch (Throwable ignored) {
                  }
                  JSObject res = new JSObject();
                  if (bmp != null) {
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      bmp.compress(Bitmap.CompressFormat.JPEG, 80, bo);
                      res.put("data", "data:image/jpeg;base64," + Base64.encodeToString(bo.toByteArray(), Base64.NO_WRAP));
                  }
                  call.resolve(res);
              }

              @PluginMethod
              public void setPlaying(PluginCall call) {
                  boolean p = Boolean.TRUE.equals(call.getBoolean("playing", false));
                  if (getActivity() instanceof MainActivity) {
                      ((MainActivity) getActivity()).setPlaying(p);
                  }
                  call.resolve();
              }

              @PluginMethod
              public void setPip(PluginCall call) {
                  boolean e = Boolean.TRUE.equals(call.getBoolean("enabled", true));
                  if (getActivity() instanceof MainActivity) {
                      ((MainActivity) getActivity()).setPip(e);
                  }
                  call.resolve();
              }
          }
          NCEOF
          cat > scripts/patch_android.py <<'NCEOF'
          import glob
          import os
          import re
          from PIL import Image, ImageDraw, ImageChops

          NATIVE = os.environ.get("NATIVE", "true").strip().lower() != "false"
          MAIN = "android/app/src/main"
          RES = MAIN + "/res"


          def make_master(size=1024):
              S = 2
              W = 512 * S

              def sc(v):
                  return int(round(v * S))

              small = Image.new("RGB", (64, 64))
              px = small.load()
              c0 = (0x1c, 0x2a, 0x66)
              c1 = (0x07, 0x0b, 0x1f)
              for y in range(64):
                  for x in range(64):
                      t = min(1.0, max(0.0, (y / 63.0 + x / 63.0 * 0.6) / 1.6))
                      px[x, y] = tuple(int(c0[i] + (c1[i] - c0[i]) * t) for i in range(3))
              img = small.resize((W, W), Image.BICUBIC).convert("RGBA")

              def layer():
                  return Image.new("RGBA", (W, W), (0, 0, 0, 0))

              l = layer()
              d = ImageDraw.Draw(l)
              for cx, cy, r in [(360, 108, 3), (404, 172, 2.5), (118, 262, 2.5), (92, 118, 2), (420, 300, 2)]:
                  d.ellipse([sc(cx - r), sc(cy - r), sc(cx + r), sc(cy + r)], fill=(0xdf, 0xe9, 0xff, 204))
              img = Image.alpha_composite(img, l)

              l = layer()
              d = ImageDraw.Draw(l)
              pts = [(338, 126), (345, 143), (362, 150), (345, 157), (338, 174), (331, 157), (314, 150), (331, 143)]
              d.polygon([(sc(x), sc(y)) for x, y in pts], fill=(0xff, 0x8c, 0xcb, 255))
              img = Image.alpha_composite(img, l)

              moon = Image.new("L", (W, W), 0)
              ImageDraw.Draw(moon).ellipse([sc(132), sc(102), sc(248), sc(218)], fill=255)
              cut = Image.new("L", (W, W), 0)
              ImageDraw.Draw(cut).ellipse([sc(164), sc(96), sc(264), sc(196)], fill=255)
              moon = ImageChops.subtract(moon, cut)
              l = Image.new("RGBA", (W, W), (0xe8, 0xf0, 0xff, 255))
              l.putalpha(moon)
              img = Image.alpha_composite(img, l)

              bars = [(135, 300, 80), (187, 250, 130), (239, 210, 170), (291, 265, 115), (343, 310, 70)]
              l = layer()
              d = ImageDraw.Draw(l)
              for x, y, h in bars:
                  d.rounded_rectangle([sc(x - 8), sc(y - 8), sc(x + 42), sc(y + h + 8)], radius=sc(25), fill=(0x4f, 0xb8, 0xff, 46))
              img = Image.alpha_composite(img, l)

              col = Image.new("RGBA", (1, W))
              cp = col.load()
              for y in range(W):
                  t = min(1.0, max(0.0, (380.0 - y / float(S)) / 170.0))
                  cp[0, y] = (int(0x4f + (0xb8 - 0x4f) * t), int(0xb8 + (0xf2 - 0xb8) * t), 255, 255)
              grad = col.resize((W, W), Image.NEAREST)
              mask = Image.new("L", (W, W), 0)
              d = ImageDraw.Draw(mask)
              for x, y, h in bars:
                  d.rounded_rectangle([sc(x), sc(y), sc(x + 34), sc(y + h)], radius=sc(17), fill=255)
              grad.putalpha(mask)
              img = Image.alpha_composite(img, grad)
              return img.convert("RGB").resize((size, size), Image.LANCZOS)


          def write_icons():
              master = make_master(1024)
              dens = {"mdpi": (48, 108), "hdpi": (72, 162), "xhdpi": (96, 216), "xxhdpi": (144, 324), "xxxhdpi": (192, 432)}
              for name, (a, f) in dens.items():
                  folder = os.path.join(RES, "mipmap-" + name)
                  if not os.path.isdir(folder):
                      continue
                  master.resize((a, a), Image.LANCZOS).save(os.path.join(folder, "ic_launcher.png"))
                  round_img = master.resize((a * 4, a * 4), Image.LANCZOS).convert("RGBA")
                  m = Image.new("L", (a * 4, a * 4), 0)
                  ImageDraw.Draw(m).ellipse([0, 0, a * 4 - 1, a * 4 - 1], fill=255)
                  round_img.putalpha(m)
                  round_img.resize((a, a), Image.LANCZOS).save(os.path.join(folder, "ic_launcher_round.png"))
                  master.resize((f, f), Image.LANCZOS).save(os.path.join(folder, "ic_launcher_foreground.png"))
              bg = os.path.join(RES, "values", "ic_launcher_background.xml")
              if os.path.exists(bg):
                  s = open(bg, encoding="utf-8").read()
                  s = re.sub(r"(<color name=\"ic_launcher_background\">)#[0-9A-Fa-f]{6,8}(</color>)", r"\g<1>#0B1230\g<2>", s)
                  open(bg, "w", encoding="utf-8").write(s)
              print("icons written")


          def patch_native():
              found = glob.glob(MAIN + "/java/**/MainActivity.java", recursive=True)
              if not found:
                  raise SystemExit("MainActivity.java not found")
              target_dir = os.path.dirname(found[0])
              old = open(found[0], encoding="
