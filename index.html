<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a58d8">
<meta name="color-scheme" content="light only">
<title>Nightcore Night</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --luna:#0a58d8;
  --luna-dark:#3d5a8c;
  --paper:#e4e1d3;
  --ink:#0b1d4a;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:#5f7088 radial-gradient(ellipse at 30% 20%,#8a98aa,#4c5b70 70%);
  font-family:Tahoma,"Segoe UI",Verdana,sans-serif;
  color:#000;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;
}
button{font:inherit;color:inherit}

.win{
  width:min(100%,980px);height:min(100%,600px);
  display:flex;flex-direction:column;
  background:var(--paper);
  border:3px solid var(--luna-dark);border-top:0;
  border-radius:3px 3px 0 0;
  box-shadow:0 12px 40px rgba(0,0,0,.45);
  position:relative;
}
@media (max-width:760px){
  .win{width:100%;height:100%;border-radius:0;border-width:0 3px 3px}
}
@media (max-width:760px) and (orientation:portrait){
  .win{height:auto;max-height:100%}
  .win .stage{flex:0 1 auto;aspect-ratio:4/3;min-height:130px}
}

/* title bar */
.titlebar{
  flex:none;height:34px;display:flex;align-items:center;gap:8px;padding:0 5px 0 8px;
  border-radius:2px 2px 0 0;
  background:linear-gradient(#6f93c8,#3f64a0 8%,#3b5f9b 40%,#4a73b0 88%,#4a73b0 93%,#43699f 95%,#33527f);
  color:#fff;font:bold 15px "Trebuchet MS",Tahoma,sans-serif;
  text-shadow:1px 1px 0 #1c2b52;
}
.titlebar .ico{width:20px;height:20px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#efe6c0,#c9993a 45%,#a8662a);
  box-shadow:0 0 0 1px rgba(0,0,0,.35);position:relative;flex:none}
.titlebar .ico::after{content:"";position:absolute;left:7px;top:5px;border-left:8px solid #34507f;border-top:5px solid transparent;border-bottom:5px solid transparent}
.titlebar .name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb{width:25px;height:25px;margin-left:2px;border:1px solid #fff;border-radius:4px;padding:0;cursor:pointer;
  background:radial-gradient(circle at 30% 25%,#9db6d8,#4a6ca3 70%);
  box-shadow:inset 0 0 2px rgba(255,255,255,.7);display:grid;place-items:center}
.wb.x{background:radial-gradient(circle at 30% 25%,#d4a898,#a85a42 70%)}
.wb svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2.2;filter:drop-shadow(1px 1px 0 rgba(0,0,60,.5))}

/* menu bar */
.menubar{flex:none;display:flex;background:linear-gradient(#f2f0e6,#e0ddd0);border-bottom:1px solid #aca899;position:relative;z-index:30}
.mi{position:relative;padding:6px 11px;font-size:15px;cursor:pointer}
.mi u{text-decoration:underline}
.mi.open,.mi:hover{background:#4a6794;color:#fff}
.dd{position:absolute;left:0;top:100%;min-width:230px;background:#fff;border:1px solid #7f9db9;box-shadow:3px 3px 6px rgba(0,0,0,.35);padding:2px;z-index:40;color:#000}
.ddi{display:flex;align-items:center;padding:9px 12px 9px 4px;font-size:15px;white-space:nowrap}
.ddi:hover{background:#4a6794;color:#fff}
.ddi .ck{width:22px;text-align:center;font-size:13px;flex:none}
.dd hr{border:0;border-top:1px solid #d6d2c2;margin:2px 0}

/* viewbar (visualizer controls) */
.viewbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:4px 6px;min-height:34px;
  background:linear-gradient(#52709f,#6a86b0);border-bottom:1px solid #34507f;color:#fff;font-size:13px}
.viewbar .sp{flex:1}
.vb{height:26px;min-width:30px;padding:0 7px;border:1px solid transparent;border-radius:3px;background:transparent;cursor:pointer;display:grid;place-items:center}
.vb svg{width:18px;height:18px;fill:#fff}
.vb[aria-pressed="true"]{background:rgba(0,20,80,.35);border-color:#cfe0ff}
.sw{width:20px;height:20px;border-radius:50%;border:2px solid #fff;padding:0;cursor:pointer;box-shadow:0 0 0 1px rgba(0,0,60,.5)}
.colorwrap{position:relative;width:26px;height:26px}
.colorwrap input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.colorwrap .cur{position:absolute;inset:2px;border-radius:5px;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,60,.5);
  background:conic-gradient(#f33,#fd3,#3f6,#3df,#63f,#f3c,#f33)}
select.bars{height:26px;border:1px solid #1d3f7f;border-radius:3px;background:#eaf1ff;color:#0b1d4a;font-size:13px;padding:0 4px}

/* stage */
.stage{flex:1;min-height:0;position:relative;overflow:hidden;background:#06143a;
  border-top:1px solid #0b2a6b;border-bottom:1px solid #0b2a6b;touch-action:manipulation}
.stage .bgfallback{position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 35%,#6f8bb0,#34507f 55%,#1a2740),#1a2740}
.stage img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;background:#06143a}
.stage[data-fit="fill"] img.bg{object-fit:fill}
.stage[data-fit="contain"] img.bg{object-fit:contain}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;opacity:0;pointer-events:none}
.stage[data-fit="fill"] video{object-fit:fill}
.stage[data-fit="contain"] video{object-fit:contain}
.stage.isvideo video{opacity:1}
.stage.isvideo img.bg,.stage.isvideo .bgfallback{display:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.np{position:absolute;left:10px;top:8px;right:10px;color:#fff;font:13px/1.35 "Lucida Console",Consolas,monospace;
  text-shadow:0 0 4px #000,1px 1px 0 #000;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  color:#fff;text-align:center;padding:20px;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.empty p{margin:0;font-size:15px;max-width:30ch;line-height:1.5}
.xpbtn{border:1px solid #003c74;border-radius:4px;padding:9px 20px;font-size:15px;cursor:pointer;color:#000;
  background:linear-gradient(#fff,#ecebe5 86%,#d8d0c4);box-shadow:inset 0 0 0 1px #fff}
.xpbtn:active{background:linear-gradient(#cdcac3,#e3e3db 10%,#f0f0ea)}

/* playlist */
.pl{position:absolute;top:0;right:0;bottom:0;width:min(300px,82%);display:none;flex-direction:column;
  background:rgba(30,45,75,.9);border-left:2px solid #8ea6c8;color:#fff;z-index:5}
.pl.show{display:flex}
.pl header{padding:8px 10px;background:linear-gradient(#5f82b4,#34507f);font-weight:bold;display:flex;justify-content:space-between;align-items:center}
.pl header button{background:none;border:0;color:#fff;font-size:18px;cursor:pointer;padding:0 4px}
.pl ol{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
.pl li{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.12);font-size:14px;cursor:pointer;display:flex;gap:8px;align-items:center}
.pl li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl li.on{background:#4a6794}
.pl li .t{flex:none;width:16px;opacity:.8}
.pl .none{padding:16px;font-size:14px;opacity:.8}

/* controls */
.controls{flex:none;padding:8px 10px 10px;
  background:linear-gradient(#a9b7cc,#7388a8 45%,#556c92);border-top:1px solid #fff3}
.seekrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.time{font:12px "Lucida Console",Consolas,monospace;color:#fff;text-shadow:0 1px 1px #0b1d4a;min-width:88px;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:20px;margin:0;cursor:pointer;flex:1;min-width:0;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;border:1px solid #06204f;
  background:linear-gradient(to right,#9bb7da var(--p),#24375c var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:20px;margin-top:-7px;border-radius:4px;
  background:linear-gradient(#fff,#b9c9e6);border:1px solid #3b5388}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;border:1px solid #1a2a48;background:#24375c}
input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:#9bb7da}
input[type=range]::-moz-range-thumb{width:13px;height:18px;border-radius:4px;background:linear-gradient(#fff,#b9c9e6);border:1px solid #3b5388}
.btnrow{display:flex;align-items:center;gap:8px}
.rb{border-radius:50%;border:2px solid #cfe0fa;cursor:pointer;display:grid;place-items:center;color:#fff;padding:0;flex:none;
  background:radial-gradient(circle at 35% 28%,#c3d3e6,#5f82b4 45%,#2f4a78);box-shadow:0 2px 4px rgba(0,0,40,.5),inset 0 0 6px rgba(255,255,255,.4)}
.rb:active{filter:brightness(.85)}
.rb.big{width:58px;height:58px}
.rb.sm{width:38px;height:38px}
.rb svg,.pill svg{fill:currentColor}
.rb.big svg{width:28px;height:28px}
.rb.sm svg{width:18px;height:18px}
.pill{width:46px;height:28px;border-radius:14px;border:2px solid #cfe0fa;cursor:pointer;display:grid;place-items:center;color:#fff;padding:0;flex:none;
  background:linear-gradient(#bccfe6,#5f82b4 50%,#2f4a78);box-shadow:0 2px 3px rgba(0,0,40,.45)}
.pill:active{filter:brightness(.85)}
.pill svg{width:18px;height:18px}
.volume{flex:1;max-width:220px;margin-left:auto}
.status{flex:none;display:flex;justify-content:space-between;padding:4px 10px;font-size:12px;background:var(--paper);border-top:1px solid #aca899;color:#222}

button:focus-visible,input:focus-visible,select:focus-visible,.mi:focus-visible{outline:2px solid #ffd54a;outline-offset:1px}
.stage.retro img.bg{filter:saturate(.7) contrast(.92) brightness(.97)}
.stage.retro::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.07) 0 1px,transparent 1px 3px)}
.mini{position:absolute;right:10px;bottom:22px;width:196px;background:#e4e1d3;border:2px solid #3d5a8c;border-top:0;z-index:4;box-shadow:2px 2px 0 rgba(0,0,0,.35);font-size:12px;color:#000}
.mh{height:20px;display:flex;align-items:center;gap:3px;padding:0 2px 0 6px;background:linear-gradient(#6f93c8,#3f64a0);color:#fff;font:bold 11px Tahoma,sans-serif;cursor:move;touch-action:none}
.mh span{flex:1}
.mh button{width:15px;height:15px;padding:0;border:1px solid #fff;border-radius:2px;background:#5f82b4;color:#fff;font-size:11px;line-height:1;cursor:pointer}
.mb{padding:8px}
.mb .tx{margin-bottom:6px}
.mini .bar{height:14px;border:1px solid #6d6a5c;background:#fff;padding:1px;overflow:hidden}
.mini .blocks{height:100%;width:0;background:repeating-linear-gradient(90deg,#3f5f94 0 7px,transparent 7px 9px)}
.mini.run .blocks{animation:fill 2.2s steps(10) infinite}
@keyframes fill{from{width:0}to{width:100%}}
.mini .cancel{display:block;margin:8px 0 0 auto;padding:3px 14px;font-size:12px;border:1px solid #3c3c3c;border-radius:3px;background:linear-gradient(#fff,#d8d4c4);cursor:pointer}
.pl header span button{margin-left:4px}
.vrow{flex:none;display:flex;gap:14px;align-items:center;padding:3px 10px;background:linear-gradient(#6a86b0,#5d7aa6);border-bottom:1px solid #34507f;color:#fff;font-size:12px}
.rl{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.rl input{height:18px}
.th{flex:none;width:42px;height:42px;background:#2f4a78 center/cover no-repeat;border:1px solid #9bb7da;display:grid;place-items:center;color:#e4ecf8;font-size:16px}
.win.compact{width:min(100%,400px);height:auto;max-height:100%}
.compact .menubar,.compact .viewbar,.compact .vrow,.compact .status,.compact .mini{display:none!important}
.win.compact .stage{flex:none;height:132px;aspect-ratio:auto}
.compact .empty{gap:8px;padding:8px}
.compact .empty p{display:none}
.compact .pl{position:fixed;top:0;bottom:0;right:0;width:min(320px,86%);z-index:50}
.compact .np{font-size:12px}
.compact .btnrow{flex-wrap:wrap}
.compact .volume{flex-basis:100%;max-width:none;margin:2px 0 0}
#bPl2{display:none}
.compact #bPl2{display:grid}
.pl li span{flex:1;min-width:0}
.pl li .st{background:none;border:0;color:#ffd54a;font-size:18px;cursor:pointer;padding:4px;flex:none}
.plbar{display:flex;gap:6px;padding:6px;border-bottom:1px solid rgba(255,255,255,.15)}
.plbar input{flex:1;min-width:0;height:28px;border:1px solid #1a2a48;border-radius:2px;padding:0 6px;font-size:13px}
.plbar select{height:28px;font-size:13px;border:1px solid #1a2a48;background:#eef2f8;max-width:46%}
.lyr{position:absolute;left:0;right:0;top:34%;transform:translateY(-50%);text-align:center;padding:0 14px;pointer-events:none;color:#fff;text-shadow:0 0 6px #000,1px 1px 0 #000;display:none}
.lyr.on{display:block}
.lyr .l1{font-size:clamp(16px,3.4vw,26px);font-weight:bold;margin:6px 0}
.lyr .l0,.lyr .l2{font-size:clamp(12px,2.2vw,16px);opacity:.65}
.compact .lyr{top:50%}
.compact .lyr .l1{font-size:15px}
.compact .lyr .l0,.compact .lyr .l2{font-size:11px}
:root{--tt:#fff;--tts:#1c2b52;--vt:#fff;--ct:#fff;--t1:#6f93c8;--t2:#3f64a0;--t3:#33527f;--m1:#f2f0e6;--m2:#e0ddd0;--sel:#4a6794;--v1:#52709f;--v2:#6a86b0;--v3:#5d7aa6;--c1:#a9b7cc;--c2:#7388a8;--c3:#556c92;--rb1:#c3d3e6;--rb2:#5f82b4;--rb3:#2f4a78;--trk1:#9bb7da;--trk2:#24375c;--plbg:rgba(30,45,75,.9);--bgfb1:#6f8bb0;--bgfb2:#34507f;--bgfb3:#1a2740;--paper2:#e4e1d3;--bodyA:#8a98aa;--bodyB:#4c5b70;--bodyC:#5f7088}
:root[data-theme="silver"]{--tt:#1d2330;--tts:rgba(255,255,255,.6);--vt:#1d2330;--ct:#1d2330;--t1:#d3d8df;--t2:#a3abb8;--t3:#737c8a;--m1:#f4f4f2;--m2:#e2e3e5;--sel:#6c7a90;--v1:#a4adbb;--v2:#bcc3ce;--v3:#aeb6c3;--c1:#d8dce3;--c2:#b3bac6;--c3:#929bab;--rb1:#eef0f4;--rb2:#a7afbd;--rb3:#6d7686;--trk1:#c9d0db;--trk2:#4a5262;--plbg:rgba(50,56,68,.9);--bgfb1:#a3abb9;--bgfb2:#6a7383;--bgfb3:#2b303b;--paper2:#e6e6e3;--bodyA:#b9bec8;--bodyB:#6b7280;--bodyC:#8a909c}
:root[data-theme="olive"]{--t1:#a9b97c;--t2:#7b8f4b;--t3:#56672f;--tts:#2f3a17;--m1:#f4f2e3;--m2:#e3e1cc;--sel:#6f8240;--v1:#7e9150;--v2:#99aa6c;--v3:#8b9d5e;--c1:#bfca9f;--c2:#97a870;--c3:#6f8043;--rb1:#d4ddb5;--rb2:#8ea05f;--rb3:#516229;--trk1:#c3d19a;--trk2:#34411c;--plbg:rgba(48,60,28,.9);--bgfb1:#97a870;--bgfb2:#566a2f;--bgfb3:#222d12;--paper2:#e6e4d2;--bodyA:#a9b57f;--bodyB:#56653a;--bodyC:#6e7d4a}
body{background:var(--bodyC) radial-gradient(ellipse at 30% 20%,var(--bodyA),var(--bodyB) 70%)}
.win{background:var(--paper2);border-color:var(--t3)}
.titlebar{background:linear-gradient(var(--t1),var(--t2) 12%,var(--t2) 85%,var(--t3));color:var(--tt);text-shadow:1px 1px 0 var(--tts)}
.wb{background:radial-gradient(circle at 30% 25%,var(--rb1),var(--rb2) 70%)}
.wb.x{background:radial-gradient(circle at 30% 25%,#d4a898,#a85a42 70%)}
.menubar{background:linear-gradient(var(--m1),var(--m2))}
.mi.open,.mi:hover,.ddi:hover,.pl li.on{background:var(--sel)}
.viewbar{background:linear-gradient(var(--v1),var(--v2));border-bottom-color:var(--t3);color:var(--vt)}
.vrow{background:linear-gradient(var(--v2),var(--v3));border-bottom-color:var(--t3);color:var(--vt)}
.vb{color:var(--vt)}
.vb svg{fill:var(--vt)}
.controls{background:linear-gradient(var(--c1),var(--c2) 45%,var(--c3))}
.time{color:var(--ct)}
.rb{background:radial-gradient(circle at 35% 28%,var(--rb1),var(--rb2) 45%,var(--rb3))}
.pill{background:linear-gradient(var(--rb1),var(--rb2) 50%,var(--rb3))}
input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(to right,var(--trk1) var(--p),var(--trk2) var(--p))}
input[type=range]::-moz-range-progress{background:var(--trk1)}
input[type=range]::-moz-range-track{background:var(--trk2)}
.mh{background:linear-gradient(var(--t1),var(--t2));color:var(--tt)}
.mini{border-color:var(--t3);background:var(--paper2)}
.pl{background:var(--plbg);border-left-color:var(--v2)}
.pl header{background:linear-gradient(var(--rb2),var(--t3))}
.stage .bgfallback{background:radial-gradient(ellipse at 50% 35%,var(--bgfb1),var(--bgfb2) 55%,var(--bgfb3)),var(--bgfb3)}
:root{--prog:#7ed957}
#seek::-webkit-slider-runnable-track,#vol::-webkit-slider-runnable-track{background:linear-gradient(to right,var(--prog) var(--p),var(--trk2) var(--p))}
#seek::-moz-range-progress,#vol::-moz-range-progress{background:var(--prog)}
#seek::-webkit-slider-thumb,#vol::-webkit-slider-thumb{background:linear-gradient(#f1fbe9,#9bd77f);border-color:#4a7a35}
#seek::-moz-range-thumb,#vol::-moz-range-thumb{background:linear-gradient(#f1fbe9,#9bd77f);border-color:#4a7a35}
.strip{flex:none;display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:3px 8px;min-height:32px;background:linear-gradient(var(--v1),var(--v2));border-bottom:1px solid var(--t3);color:var(--vt)}
.optpanel{flex:none;display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
.optpanel.open{grid-template-rows:1fr}
.optin{overflow:hidden;min-height:0;max-height:44vh;visibility:hidden;transition:visibility 0s .28s}
.optpanel.open .optin{visibility:visible;overflow:auto;transition-delay:0s}
.optdone{display:flex;justify-content:flex-end;padding:4px 8px;background:var(--v3);border-bottom:1px solid var(--t3)}
.optdone .xpbtn{padding:3px 14px;font-size:12px}
.compact .strip,.compact .optpanel{display:none!important}
.sw.on{box-shadow:0 0 0 2px #ffd54a,0 0 0 1px rgba(0,0,60,.5)}
:root[data-theme="pixel"]{--tt:#fff;--tts:#0f1089;--vt:#fff;--ct:#fff;--t1:#0997ff;--t2:#0053ee;--t3:#003dd7;--m1:#fff;--m2:#ece9d8;--sel:#316ac5;--v1:#3a64b4;--v2:#5b84cf;--v3:#4a74c0;--c1:#8fb0e4;--c2:#4a77c4;--c3:#2a55a8;--rb1:#bfe0ff;--rb2:#2a7ae8;--rb3:#0b3fa8;--trk1:#8cc0ff;--trk2:#0d2a6b;--plbg:rgba(8,32,100,.9);--bgfb1:#6aa8f0;--bgfb2:#2a5fc4;--bgfb3:#0a2260;--paper2:#ece9d8;--bodyA:#6fa3dc;--bodyB:#2b5a96;--bodyC:#3a6ea5}
:root[data-theme="pixel"] .win,:root[data-theme="pixel"] .titlebar{border-radius:0}


:root[data-theme="pixel"] body{-webkit-font-smoothing:none}
.strip{display:none!important}
:root[data-theme="pixel"] .titlebar,:root[data-theme="pixel"] .controls,:root[data-theme="pixel"] .status{filter:url(#pixelate)}
:root[data-theme="pixel"] .menubar{filter:url(#pixelate-m)}
:root[data-theme="pixel"] .win{border-width:0 4px 4px}
:root[data-theme="pixel"] .mi{font-size:16px}
:root[data-theme="pixel"] .status{font-size:14px;font-weight:bold}
:root[data-theme="pixel"] .time{font-size:13px}
.controls{padding:5px 10px 7px}
.seekrow{margin-bottom:4px;gap:8px}
.time{font-size:11px;min-width:76px}
.btnrow{gap:6px}
.rb.big{width:46px;height:46px}
.rb.sm{width:30px;height:30px}
.rb.big svg{width:22px;height:22px}
.rb.sm svg{width:14px;height:14px}
.pill{width:40px;height:22px}
.pill svg{width:14px;height:14px}
input[type=range]{height:16px}
#seek::-webkit-slider-runnable-track,#vol::-webkit-slider-runnable-track{height:6px}
#seek::-webkit-slider-thumb,#vol::-webkit-slider-thumb{width:13px;height:16px;margin-top:-5px}
.bgv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;pointer-events:none;background:transparent}
.bgv.on{opacity:1}
.stage[data-fit="fill"] .bgv{object-fit:fill}
.stage[data-fit="contain"] .bgv{object-fit:contain}
.stage.isvideo .bgv{display:none}
.stage.retro .bgv{filter:saturate(.7) contrast(.92) brightness(.97)}
:root{color-scheme:only light}
#pageBg{position:fixed;inset:0;z-index:0;background:center/cover no-repeat;filter:blur(28px) brightness(.45);transform:scale(1.15);display:none;pointer-events:none}
body[data-bg="pic"] #pageBg{display:block}
body[data-bg="black"],body[data-bg="pic"]{background:#000}
body[data-bg="color"]{background:var(--pbgc,#000)}
.win{position:relative;z-index:1}
.pbgc{width:30px;height:26px;border:1px solid #fff;border-radius:3px;padding:0;background:none;cursor:pointer}
html.pip .titlebar,html.pip .menubar,html.pip .optpanel,html.pip .strip,html.pip .controls,html.pip .status,html.pip .mini,html.pip .pl,html.pip .lyr{display:none!important}
html.pip body{background:#000}
html.pip #pageBg{display:none}
html.pip .win{width:100%;height:100%;max-height:none;border:0;border-radius:0}
html.pip .win .stage{flex:1;aspect-ratio:auto;height:auto;min-height:0}
html.pip .np{font-size:11px}
.home{display:none;flex:1;min-height:0;flex-direction:column;background:var(--paper2)}
.win.home-mode #home{display:flex}
.win.home-mode .stage,.win.home-mode .controls,.win.home-mode .status,.win.home-mode .optpanel,.win.home-mode .strip{display:none!important}
.win.home-mode #wLib{display:none}
.win.compact.home-mode{height:min(100%,520px)}
.hbar{display:flex;gap:6px;padding:8px;background:linear-gradient(var(--v1),var(--v2));align-items:center;flex-wrap:wrap}
.hbar input{flex:1;min-width:120px;height:30px;border:1px solid #1a2a48;border-radius:2px;padding:0 8px;font-size:14px}
.hbar .xpbtn{padding:5px 12px;font-size:13px}
.htabs{display:flex;gap:2px;padding:6px 8px 0;background:var(--m2);border-bottom:2px solid var(--t3)}
.htabs button{border:1px solid #8a8a7a;border-bottom:0;border-radius:4px 4px 0 0;background:#f0eee2;padding:6px 14px;font-size:14px;cursor:pointer;color:#000}
.htabs button.on{background:#fff;font-weight:bold;position:relative;top:2px}
.hgrid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;padding:10px;align-content:start;background:#fff}
.hc{cursor:pointer;display:flex;flex-direction:column;gap:4px;content-visibility:auto;contain-intrinsic-size:150px}
.hth{aspect-ratio:1;width:100%;background:#2f4a78 center/cover no-repeat;border:1px solid #9bb7da;display:grid;place-items:center;color:#e4ecf8;font-size:28px;position:relative}
.hth .vb2{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:1px 5px;border-radius:2px}
.hc .tt{font-size:13px;line-height:1.25;font-weight:bold;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;color:#000}
.hc .ar{font-size:12px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc.on .hth{outline:3px solid #ffd54a}
.hnone{grid-column:1/-1;text-align:center;color:#555;padding:30px 10px;font-size:14px;line-height:1.6;white-space:pre-line}
.hnow{display:none;align-items:center;gap:10px;padding:6px 10px;background:linear-gradient(var(--c1),var(--c2));border-top:1px solid var(--t3);cursor:pointer;color:#fff}
.hnow.show{display:flex}
.hnow .th{width:40px;height:40px}
.hnow .nt{flex:1;min-width:0;font-size:13px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 1px rgba(0,0,0,.5)}
html.pip #home{display:none!important}
.rmb{position:absolute;left:4px;top:4px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:3px;font-size:12px;padding:3px 7px;cursor:pointer}
.rmb.arm{background:#c0392b}
.win.home-mode{height:min(100%,700px);max-height:100%}
.drop::after{content:"Drop files here";position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,88,216,.7);color:#fff;font-size:22px;z-index:60}

<script>
(function(){
  var pipDoc=null;
  var $ = function(s){return document.querySelector(s)||(pipDoc&&pipDoc.querySelector(s))};
  var media=$('#media'), stage=$('#stage'), bg=$('#bg'), fb=$('#bgFallback'), cv=$('#cv'), g=cv.getContext('2d');
  var ICON={
    play:'<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>',
    pause:'<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
    stop:'<svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>',
    prev:'<svg viewBox="0 0 24 24"><path d="M6 5h2.4v14H6zM20 5v14L9 12z"/></svg>',
    next:'<svg viewBox="0 0 24 24"><path d="M15.6 5H18v14h-2.4zM4 5l11 7-11 7z"/></svg>',
    vol:'<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9z"/><path d="M15 9.2a4 4 0 010 5.6M17.4 6.8a7.4 7.4 0 010 10.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    mute:'<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9z"/><path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
  };
  $('#bStop').innerHTML=ICON.stop; $('#bPrev').innerHTML=ICON.prev; $('#bNext').innerHTML=ICON.next;

  /* ---------- settings ---------- */
  var S={on:true,color:'#8fe3ff',bars:48,fit:'cover',mini:true,retro:true,h:.62,a:1,mp:null,compact:false,vs:'bars',theme:'classic',sort:'manual',fav:{},lyr:true,cm:'solid',pbg:'theme',pbgc:'#000000',pip:true,autoscan:true,keep:true};
  try{var sv=JSON.parse(localStorage.getItem('mpxp')||'null'); if(sv) for(var k in S) if(sv[k]!==undefined) S[k]=sv[k];}catch(e){}
  function save(){try{localStorage.setItem('mpxp',JSON.stringify(S))}catch(e){}}

  /* ---------- state ---------- */
  var tracks=[], cur=-1, defaultImg=null, shuffle=false, repeat=0, muted=false, vol=0.8, dragging=false;
  var FIT=['cover','fill','contain'], FITL={cover:'Fill (crop to fit)',fill:'Stretch',contain:'Fit (show whole image)'};
  var VIDRE=/\.(mp4|webm|mov|mkv|m4v)$/i, MEDRE=/\.(mp3|m4a|wav|ogg|oga|flac|aac|opus|mp4|webm|mov|mkv|m4v)$/i;

  /* ---------- audio graph (for visualizer + volume) ---------- */
  var ctx=null, analyser=null, gain=null, fdata=null;
  function initAudio(){
    if(ctx) return;
    try{
      var AC=window.AudioContext||window.webkitAudioContext;
      ctx=new AC();
      analyser=ctx.createAnalyser(); analyser.fftSize=512; analyser.smoothingTimeConstant=.65;
      gain=ctx.createGain();
      var src=ctx.createMediaElementSource(media);
      src.connect(analyser); analyser.connect(gain); gain.connect(ctx.destination);
      fdata=new Uint8Array(analyser.frequencyBinCount);
      media.volume=1; applyVol();
    }catch(e){ctx=null;analyser=null;gain=null;var nn=$('#np');if(nn)nn.textContent+='  · bars are simulated here'}
  }
  function applyVol(){
    var v=muted?0:vol;
    if(gain){gain.gain.value=v}else{try{media.volume=v}catch(e){}}
    $('#bMute').innerHTML=(muted||vol===0)?ICON.mute:ICON.vol;
  }

  /* ---------- playlist / playback ---------- */
  function fmt(t){if(!isFinite(t))t=0;var m=Math.floor(t/60),s=Math.floor(t%60);return (m<10?'0':'')+m+':'+(s<10?'0':'')+s}
  function setStatus(t){$('#stText').textContent=t}
  function addFiles(list){
    var added=0,imgs=[],lrcMap={};
    Array.prototype.forEach.call(list,function(f){if(/\.lrc$/i.test(f.name)) lrcMap[f.name.replace(/\.[^.]+$/,'').toLowerCase()]=f});
    Array.prototype.forEach.call(list,function(f){
      if((f.type&&f.type.indexOf('image/')===0)||/\.(png|jpe?g|gif|webp|bmp|avif)$/i.test(f.name)){imgs.push(f);return}
      var isMed=(f.type&&(f.type.indexOf('audio/')===0||f.type.indexOf('video/')===0))||MEDRE.test(f.name);
      if(!isMed) return;
      var isVid=(f.type&&f.type.indexOf('video/')===0)||VIDRE.test(f.name);
      if(known(f)) return; var tr={id:fid(f),name:f.name.replace(/\.[^.]+$/,''),file:f,url:URL.createObjectURL(f),video:isVid,img:null,thumb:null}; tracks.push(tr); enqueue(tr); var lf0=lrcMap[tr.name.toLowerCase()]; if(lf0) loadLrc(tr,lf0);
      added++;
    });
    if(imgs.length) setImage(URL.createObjectURL(imgs[imgs.length-1]));
    renderList();
    if(added&&!inHome()) play(tracks.length-added);
  }
  function setImage(url){
    defaultImg=url;
    if(cur>=0){tracks[cur].img=url; persistTrack(tracks[cur])}
    showTrack();
  }
  function showTrack(){
    var t=tracks[cur], has=!!t;
    $('#empty').style.display=tracks.length?'none':'flex';
    stage.classList.toggle('isvideo',has&&t.video);
    var src=has?(t.img||defaultImg):defaultImg;
    if(src&&!(has&&t.video)){setBg(src);bg.style.display='block';fb.style.display='none'}
    else{bg.style.display='none';fb.style.display=(has&&t.video)?'none':'block'}
    $('#np').textContent=has?'♪ '+label(t):''; updateSession(); lyIdx=-2; updateLyrics(); updateAuto(); bgvApply(); updatePageBg();
    $('#winTitle').textContent=has?label(t)+' — Nightcore Night':'Nightcore Night';
    $('#stCount').textContent=tracks.length+(tracks.length===1?' item':' items');
  }
  function renderList(){ renderHomeSoon();
    var ol=$('#plList'); ol.innerHTML='';
    if(!tracks.length){var n=document.createElement('li');n.className='none';n.textContent='No items yet.';ol.appendChild(n)}
    viewOrder().forEach(function(i){var t=tracks[i];

      return new Promise(function(res,rej){
        var tx=db.transaction('tracks',mode), out=fn(tx.objectStore('tracks'));
        tx.oncomplete=function(){res(out&&out.result)};
        tx.onerror=function(){rej(tx.error)};
        tx.onabort=function(){rej(tx.error)};
      });
    });
  }
  function blobOf(u){
    if(!u||u.indexOf('blob:')!==0) return Promise.resolve(null);
    return fetch(u).then(function(r){return r.blob()}).catch(function(){return null});
  }
  function persistTrack(t){
    if(!S.keep||!t||!t.file||t.native||!t.id||!window.indexedDB) return Promise.resolve();
    if(!askedPersist){askedPersist=true; try{if(navigator.storage&&navigator.storage.persist) navigator.storage.persist()}catch(e){}}
    return Promise.all([blobOf(t.thumb),(t.img&&t.img!==t.thumb)?blobOf(t.img):Promise.resolve(null),blobOf(t.bgv)]).then(function(b){
      var rec={id:t.id,name:t.name,title:t.title||null,artist:t.artist||null,video:!!t.video,file:t.file,
        thumb:b[0],img:b[1],imgSame:!!(t.img&&t.img===t.thumb),bgv:b[2],lrc:t.lrcText||null,added:t.added||Date.now()};
      return idbDo('readwrite',function(st){return st.put(rec)});
    }).catch(function(){
      if(!warnedFull){warnedFull=true; setStatus('Could not save to the library (storage may be full)')}
    });
  }
  function loadSaved(){
    if(!S.keep||!window.indexedDB) return Promise.resolve();
    return idbDo('readonly',function(st){return st.getAll()}).then(function(list){
      if(!list||!list.length) return;
      list.sort(function(a,b){return a.added-b.added});
      var u=function(b){return b?URL.createObjectURL(b):null};
      list.forEach(function(r){
        if(savedIds[r.id]) return;
        savedIds[r.id]=1;
        var th=u(r.thumb), im=r.imgSame?th:u(r.img);
        var tr={id:r.id,name:r.name,title:r.title||undefined,artist:r.artist||undefined,file:r.file,url:URL.createObjectURL(r.file),
          video:!!r.video,img:im,thumb:th,bgv:u(r.bgv),added:r.added,saved:true};
        if(r.lrc){tr.lrcText=r.lrc; var l=parseLrc(r.lrc); if(l.lines.length) tr.lrc=l}
        tracks.push(tr);
      });
      renderList(); showTrack();
    }).catch(function(){});
  }
  function wipeSaved(){
    if(!window.indexedDB) return Promise.resolve();
    return idbDo('readwrite',function(st){return st.clear()}).catch(function(){});
  }
  function setKeep(on){
    S.keep=on; save();
    if(on) tracks.forEach(function(t){persistTrack(t)}); else wipeSaved();
  }
  function removeTrack(i){
    var t=tracks[i]; if(!t) return;
    if(i===cur){media.pause(); media.removeAttribute('src'); try{media.load()}catch(e){} cur=-1}
    else if(i<cur) cur--;
    tracks.splice(i,1);
    [t.url,t.blobUrl].forEach(function(u){if(u&&u.indexOf('blob:')===0){try{URL.revokeObjectURL(u)}catch(e){}}});
    if(t.id){
      delete savedIds[t.id];
      idbDo('readwrite',function(st){return st['delete'](t.id)}).catch(function(){});
    }
    renderList(); showTrack(); renderHome();
  }

  /* window buttons */
  $('#wMin').onclick=function(){setCompact(!S.compact)};
  $('#wMax').onclick=function(){if(S.compact){setCompact(false);return} if(canFS) fs(); else cycleFit()};
  $('#wClose').onclick=stop;

  /* keyboard */
  document.addEventListener('keydown',function(e){
    if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
    if(e.code==='Space'){e.preventDefault();toggle()}
    else if(e.key==='ArrowRight'){media.currentTime+=5}
    else if(e.key==='ArrowLeft'){media.currentTime-=5}
  });

  /* drag & drop */
  var win=$('#win');
  ['dragenter','dragover'].forEach(function(n){win.addEventListener(n,function(e){e.preventDefault();win.classList.add('drop')})});
  ['dragleave','drop'].forEach(function(n){win.addEventListener(n,function(e){e.preventDefault();win.classList.remove('drop')})});
  win.addEventListener('drop',function(e){if(e.dataTransfer&&e.dataTransfer.files) addFiles(e.dataTransfer.files)});

  /* ---------- visualizer drawing ---------- */
  var dpr=1, hs=[], pk=[];
  function resetBars(){hs=[];pk=[];for(var i=0;i<S.bars;i++){hs.push(0);pk.push(0)}}
  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    cv.width=Math.max(1,Math.round(stage.clientWidth*dpr));
    cv.height=Math.max(1,Math.round(stage.clientHeight*dpr));
  }
  if(window.ResizeObserver) new ResizeObserver(resize).observe(stage); else window.addEventListener('resize',resize);
  function rgba(hex,a){
    var h=hex.replace('#',''); if(h.length===3) h=h.replace(/(.)/g,'$1$1');
    var n=parseInt(h,16); return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')';
  }
  function levels(n,t){
    var out=new Array(n), i;
    if(media.paused){for(i=0;i<n;i++)out[i]=0;return out}
    if(analyser){
      analyser.getByteFrequencyData(fdata);
      var top=Math.floor(fdata.length*.72);
      for(i=0;i<n;i++){
        var a=Math.floor(Math.pow(i/n,1.9)*top), b=Math.max(a+1,Math.floor(Math.pow((i+1)/n,1.9)*top)), m=0;
        for(var j=a;j<b&&j<fdata.length;j++) if(fdata[j]>m) m=fdata[j];
        var v=m/255*(1+i/n*.55); out[i]=Math.min(1,Math.pow(v,1.5));
      }
    }else{
      for(i=0;i<n;i++) out[i]=.15+.55*Math.abs(Math.sin(t/260+i*.55))*Math.abs(Math.sin(t/610+i*.21));
    }
    return out;
  }
  var last=performance.now();
  var loopGen=0;
  function startLoop(){var my=++loopGen;function tick(t){if(my!==loopGen)return;(pip||window).requestAnimationFrame(tick);frame(t)}(pip||window).requestAnimationFrame(tick)}
  function frame(t){
    var w=cv.width,h=cv.height; g.clearRect(0,0,w,h);
    if(!S.on) return;
    var n=S.bars; if(hs.length!==n) resetBars();
    var dt=Math.max(0,Math.min(50,t-last))/16.7; last=t;
    var lv=levels(n,t), i;
    for(i=0;i<n;i++){
      if(lv[i]>hs[i]) hs[i]=hs[i]+(lv[i]-hs[i])*.55; else hs[i]=Math.max(0,hs[i]-.014*dt);
      pk[i]=Math.max(hs[i],pk[i]-.006*dt);
    }
    var slot=w/n, gap=slot*.26, bw=slot-gap, maxH=h*S.h, base=h-10*dpr;
    var grad=g.createLinearGradient(0,base,0,base-maxH);
    grad.addColorStop(0,rgba(S.color,.5*S.a)); grad.addColorStop(1,rgba(S.color,S.a));
    g.fillStyle=grad; g.shadowColor=rgba(S.color,S.a); g.shadowBlur=(n>64?0:8)*dpr;
    
    for(i=0;i<n;i++){
      var bh=Math.max(2*dpr,hs[i]*maxH); if(S.cm==='rainbow'){g.fillStyle='hsla('+Math.round(i/n*300)+',90%,60%,'+S.a+')'; g.shadowColor=g.fillStyle}
      g.fillRect(i*slot+gap/2,base-bh,bw,bh);
    }
    g.shadowBlur=0; g.fillStyle=rgba(S.color,S.a*.95);
    for(i=0;i<n;i++){
      if(pk[i]>.02){ if(S.cm==='rainbow') g.fillStyle='hsla('+Math.round(i/n*300)+',90%,70%,'+S.a+')'; g.fillRect(i*slot+gap/2,base-pk[i]*maxH-5*dpr,bw,2.5*dpr); }
    }
  }

  /* ---------- init ---------- */
  setColor(S.color); setViz(S.on); stage.dataset.fit=S.fit; setMini(S.mini); setRetro(S.retro);
  $('#vizH').value=Math.round(S.h*100); $('#vizA').value=Math.round(S.a*100); setH(+$('#vizH').value); setA(+$('#vizA').value);
  if(location.hash==='#mini') S.compact=true;
  setCompact(S.compact,true); startLoop(); placeMini(); initSession();
  setTheme(S.theme,true); $('#plSort').value=S.sort; setLyr(S.lyr);
  $('#pbgSel').value=S.pbg; $('#pbgColor').value=S.pbgc; applyPageBg();
  $('#hScan').textContent=nativePlugin()?'Scan music…':'Scan folder…'; renderHome();
  loadSaved();
  if(nativePlugin()){ ncall('setPip',{enabled:!!S.pip}); if(S.autoscan) setTimeout(function(){nativeScan(true)},900) }
  $('#barCount').value=String(S.bars);
  resetBars(); resize(); syncPlay(); applyVol(); showTrack(); renderList();
  requestAnimationFrame(frame);
})();
</script>
</body>
